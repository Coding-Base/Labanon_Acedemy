server {
  listen 80;
  server_name www.lighthubacademy.org;
  return 301 https://lighthubacademy.org$request_uri;
}

server {
  listen 80;
  server_name lighthubacademy.org _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy sitemap.xml to Django backend so crawlers can reach it on the main domain
  location = /sitemap.xml {
    proxy_pass http://main_backend:8000/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Proxy robots.txt to Django backend for the dynamic sitemap reference
  location = /robots.txt {
    proxy_pass http://main_backend:8000/robots.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to backend (adjust hostname as needed)
  location /api/ {
    proxy_pass http://main_backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
